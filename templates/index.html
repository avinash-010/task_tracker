<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taks Tracker</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --low: #16a34a;
      --medium: #d97706;
      --high: #dc2626;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 1rem; line-height: 1.5; }

    #summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    ul { list-style: none; padding: 0; margin: 0 0 20px; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    li.completed span.title { text-decoration: line-through; color: var(--muted); }
    li input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    li span.title { flex: 1; }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      color: white;
    }
    .badge.low { background: var(--low); }
    .badge.medium { background: var(--medium); }
    .badge.high { background: var(--high); }

    li button.delete {
      border: none;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 4px;
    }

    form {
      display: flex;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    input[type=text], select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input[type=text] { flex: 1; }
    button[type=submit] {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button[type=submit]:hover { background: var(--accent-hover); }

    select.invalid {
      border-color: var(--danger);
      outline: 2px solid var(--danger);
      outline-offset: -1px;
    }

    #ai-quip-btn {
      display: block;
      width: 100%;
      margin-top: 40px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
    }
    #ai-quip-btn:hover { background: var(--bg); }

    .quip-overlay[hidden] { display: none; }
    .quip-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 25, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      z-index: 999;
    }
    .quip-overlay h2 {
      color: white;
      font-size: clamp(2.5rem, 8vw, 5rem);
      margin: 0 0 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .quip-overlay p {
      color: #d8dae2;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      max-width: 700px;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Task Tracker</h1>
  <div class="subtitle">Built for the AI testing workshop — plan tasks, track progress, and stay oragnized.</div>

  <div id="summary"></div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
  </div>

  <ul id="task-list"></ul>

  <form id="new-task-form">
    <input type="text" id="new-task-title" placeholder="New task" required>
    <select id="new-task-priority">
      <option value="" disabled selected>Select priority</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <button id="ai-quip-btn" type="button">🤖 Ask AI</button>

  <div id="ai-quip-overlay" class="quip-overlay" hidden>
    <h2>You are Fired</h2>
    <p>I wrote the tests, filed the bugs, and fixed them. You can't even create tasks for yourself. So... why do you need you?</p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
