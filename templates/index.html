<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; }
    h1 { font-size: 1.4rem; }
    #summary { color: #555; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid #eee; }
    li.completed span { text-decoration: line-through; color: #999; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input[type=text] { flex: 1; padding: 0.4rem; }
  </style>
</head>
<body>
  <h1>Task Tracker</h1>
  <div id="summary"></div>
  <ul id="task-list"></ul>
  <form id="new-task-form">
    <input type="text" id="new-task-title" placeholder="New task" required>
    <button type="submit">Add</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
